services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spotway
      POSTGRES_PASSWORD: spotway
      POSTGRES_DB: spotway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotway -d spotway"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
